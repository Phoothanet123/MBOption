<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e50914"><meta name="description" content="MB Option ร้านแฟชั่นสตรีทแวร์ หมวก เสื้อ กางเกง รองเท้า และถุงเท้า">
<link rel="manifest" href="manifest.json"><title>MB Option | Fashion for You</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap');
:root{--red:#ed101b;--red2:#a9000a;--black:#080808;--panel:#151515;--muted:#aaa;--white:#f8f8f8}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--white);font-family:'Kanit',sans-serif}button,input{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:radial-gradient(circle at 20% 20%,#390006,transparent 45%),#050505}
.auth-art{display:flex;align-items:center;justify-content:center;padding:34px}.auth-art img{width:min(100%,690px);max-height:88vh;object-fit:contain;filter:drop-shadow(0 18px 35px #000)}
.auth-box{display:flex;align-items:center;justify-content:center;padding:28px}.auth-card{width:min(100%,440px);background:linear-gradient(145deg,#191919,#0c0c0c);border:1px solid #393939;border-top:3px solid var(--red);border-radius:22px;padding:30px;box-shadow:0 25px 70px #000}
.brand-mini{display:flex;align-items:center;gap:12px;margin-bottom:20px}.brand-mini img{width:65px;height:65px;object-fit:contain}.brand-mini strong{font-size:27px;font-style:italic}.brand-mini span{display:block;color:#aaa;font-size:12px;letter-spacing:3px}
h1,h2,p{margin-top:0}.auth-card h2{font-size:27px;margin-bottom:5px}.sub{color:#aaa;font-size:14px;margin-bottom:22px}
.field{margin:14px 0}.field label{display:block;font-size:13px;color:#ddd;margin-bottom:7px}.field input{width:100%;background:#080808;color:white;border:1px solid #414141;border-radius:10px;padding:13px 14px;outline:none}.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ed101b22}
.primary{width:100%;border:0;border-radius:10px;padding:13px;background:linear-gradient(100deg,#ff2631,#b9000a);color:#fff;font-weight:700;box-shadow:0 7px 20px #ed101b33}.primary:hover{filter:brightness(1.12)}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:17px;font-size:13px}.link{color:#ff555d;background:none;border:0;padding:0}.message{font-size:13px;min-height:20px;margin:10px 0;color:#ff747b}
.topbar{position:sticky;top:0;z-index:5;background:#090909ee;backdrop-filter:blur(12px);border-bottom:1px solid #282828;padding:10px max(18px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:9px;min-width:180px}.brand img{width:54px;height:48px;object-fit:contain}.brand b{font-size:23px;font-style:italic}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#aaa}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.nav button{background:transparent;color:#ddd;border:1px solid transparent;padding:9px 12px;border-radius:8px}.nav button:hover,.nav button.active{background:#250407;border-color:#8d1017;color:#fff}
.user-actions{display:flex;gap:8px}.outline{background:#151515;color:#fff;border:1px solid #555;border-radius:9px;padding:9px 12px}.red-outline{border-color:var(--red);color:#ff656d}
main{max-width:1240px;margin:auto;padding:24px 20px 60px}.hero{position:relative;border:1px solid #3b090d;border-radius:18px;overflow:hidden;background:#0c0c0c;margin-bottom:26px}.hero img{width:100%;display:block;max-height:420px;object-fit:cover;object-position:center 45%}.hero-copy{position:absolute;left:5%;bottom:10%;text-shadow:0 3px 15px #000}.hero-copy h1{font-size:clamp(26px,5vw,54px);margin:0;font-style:italic}.hero-copy p{margin:3px 0 15px;color:#eee}.section-head{display:flex;justify-content:space-between;align-items:end;margin:26px 0 14px}.section-head h2{margin:0;font-size:24px}.section-head span{color:#aaa;font-size:13px}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.cat{background:linear-gradient(145deg,#1b1b1b,#0d0d0d);border:1px solid #383838;border-radius:14px;padding:16px 10px;text-align:center;color:white;transition:.2s}.cat:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 8px 24px #ed101b22}.cat .emoji{font-size:34px;display:block;margin-bottom:5px}.cat b{font-size:15px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.product{background:#151515;border:1px solid #303030;border-radius:14px;overflow:hidden}.product-art{height:155px;background:radial-gradient(circle,#292929,#101010);display:grid;place-items:center;font-size:66px}.product-info{padding:13px}.product-info small{color:#aaa}.product-info b{display:block;margin:3px 0 8px}.price{color:#ff4c55;font-weight:700}.product-info button{width:100%;margin-top:10px;background:#250407;border:1px solid #8e151d;color:white;border-radius:8px;padding:8px}
.page-panel{background:#131313;border:1px solid #333;border-radius:16px;padding:22px;min-height:260px}.order{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding:14px 0}.order:last-child{border:0}.status{color:#ff777d;font-size:13px}.empty{color:#aaa;text-align:center;padding:55px 10px}
footer{text-align:center;color:#777;border-top:1px solid #252525;padding:24px;font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(100%,520px);background:#151515;border:1px solid #6c1118;border-radius:18px;padding:23px;box-shadow:0 20px 70px #000}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#292929;color:white;border:0;border-radius:8px;padding:6px 11px}.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.modal-grid button{padding:15px;background:#090909;color:white;border:1px solid #444;border-radius:10px}.modal-grid button:hover{border-color:var(--red)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#f01622;color:white;padding:12px 20px;border-radius:30px;z-index:30;box-shadow:0 8px 30px #0009}
@media(max-width:850px){.auth-wrap{grid-template-columns:1fr}.auth-art{display:none}.topbar{flex-wrap:wrap}.nav{order:3;width:100%;justify-content:center}.brand{min-width:unset}.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){main{padding:15px 12px 40px}.topbar{padding:8px 12px}.brand b{font-size:19px}.brand img{width:43px;height:42px}.nav{gap:2px}.nav button{padding:7px 8px;font-size:12px}.user-actions .outline{padding:7px 9px;font-size:12px}.hero img{min-height:260px;object-fit:cover}.hero-copy{left:5%;bottom:7%}.categories{grid-template-columns:repeat(3,1fr);gap:8px}.cat{padding:12px 5px}.cat .emoji{font-size:27px}.cat b{font-size:12px}.products{gap:9px}.product-art{height:125px;font-size:52px}.product-info{padding:10px}.auth-card{padding:23px 19px}}
</style>
</head>
<body>
<section id="auth" class="auth-wrap">
 <div class="auth-art"><img src="logo-store.png" alt="MB Option fashion logo"></div>
 <div class="auth-box"><div class="auth-card">
  <div class="brand-mini"><img src="logo-mark.png" alt="MB"><div><strong>MB Option</strong><span>FASHION FOR YOU</span></div></div>
  <div id="loginForm">
   <h2>เข้าสู่ระบบ</h2><p class="sub">ยินดีต้อนรับกลับสู่ MB Option</p>
   <div class="field"><label>อีเมล (ต้องเป็น Gmail)</label><input id="loginEmail" type="email" placeholder="example@gmail.com" autocomplete="username"></div>
   <div class="field"><label>รหัสผ่าน</label><input id="loginPass" type="password" placeholder="รหัสผ่านอย่างน้อย 8 ตัวอักษร" autocomplete="current-password"></div>
   <div class="message" id="loginMsg"></div><button class="primary" onclick="login()">เข้าสู่ระบบ</button>
   <div class="auth-links"><button class="link" onclick="showAuth('register')">สมัครสมาชิก</button><button class="link" onclick="showAuth('forgot')">ลืมรหัสผ่าน?</button></div>
  </div>
  <div id="registerForm" class="hidden">
   <h2>สมัครสมาชิก</h2><p class="sub">สร้างบัญชีเพื่อใช้งานร้าน MB Option</p>
   <div class="field"><label>ชื่อที่ใช้แสดง</label><input id="regName" placeholder="ชื่อของคุณ"></div>
   <div class="field"><label>อีเมล Gmail</label><input id="regEmail" type="email" placeholder="example@gmail.com"></div>
   <div class="field"><label>ตั้งรหัสผ่าน</label><input id="regPass" type="password" placeholder="อย่างน้อย 8 ตัวอักษร"></div>
   <div class="field"><label>ยืนยันรหัสผ่าน</label><input id="regConfirm" type="password" placeholder="กรอกรหัสผ่านอีกครั้ง"></div>
   <div class="message" id="regMsg"></div><button class="primary" onclick="register()">สร้างบัญชี</button>
   <div class="auth-links"><button class="link" onclick="showAuth('login')">กลับไปเข้าสู่ระบบ</button></div>
  </div>
  <div id="forgotForm" class="hidden">
   <h2>ลืมรหัสผ่าน</h2><p class="sub">กรอกอีเมลและตั้งรหัสผ่านใหม่ (ตัวอย่างระบบสำหรับส่งงาน)</p>
   <div class="field"><label>อีเมล Gmail</label><input id="forgotEmail" type="email" placeholder="example@gmail.com"></div>
   <div class="field"><label>รหัสผ่านใหม่</label><input id="forgotPass" type="password" placeholder="อย่างน้อย 8 ตัวอักษร"></div>
   <div class="message" id="forgotMsg"></div><button class="primary" onclick="resetPassword()">บันทึกรหัสผ่านใหม่</button>
   <div class="auth-links"><button class="link" onclick="showAuth('login')">กลับไปเข้าสู่ระบบ</button></div>
  </div>
 </div></div>
</section>
<div id="store" class="hidden">
<header class="topbar">
 <div class="brand"><img src="logo-mark.png" alt="MB Option logo"><div><b>MB Option</b><small>FASHION FOR YOU</small></div></div>
 <nav class="nav">
  <button class="active" onclick="navigate('home',this)">หน้าแรก</button>
  <button onclick="openCategory()">หมวดหมู่สินค้า</button>
  <button onclick="navigate('orders',this)">ประวัติการสั่งซื้อ</button>
 </nav>
 <div class="user-actions"><button class="outline" id="userLabel">สมาชิก</button><button class="outline red-outline" onclick="logout()">ออกจากระบบ</button></div>
</header>
<main id="mainContent"></main>
<footer>© 2026 MB Option · FASHION FOR YOU · ใส่ได้ทุกสไตล์ ในแบบที่เป็นคุณ</footer>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const categories=[{name:'หมวก',emoji:'🧢',key:'hat'},{name:'เสื้อ',emoji:'👕',key:'shirt'},{name:'กางเกง',emoji:'👖',key:'pants'},{name:'รองเท้า',emoji:'👟',key:'shoes'},{name:'ถุงเท้า',emoji:'🧦',key:'socks'}];
const products=[
 {name:'หมวก MB Street Cap',cat:'หมวก',emoji:'🧢',price:290},{name:'เสื้อ MB Basic Tee',cat:'เสื้อ',emoji:'👕',price:390},
 {name:'กางเกง Cargo Street',cat:'กางเกง',emoji:'👖',price:590},{name:'รองเท้า Urban Sneaker',cat:'รองเท้า',emoji:'👟',price:990},
 {name:'ถุงเท้า MB Logo',cat:'ถุงเท้า',emoji:'🧦',price:99},{name:'เสื้อ Oversize MB',cat:'เสื้อ',emoji:'👕',price:450},
 {name:'หมวก Racing Edition',cat:'หมวก',emoji:'🧢',price:350},{name:'กางเกง Daily Fit',cat:'กางเกง',emoji:'👖',price:490}
];
let currentUser=null;
const $=id=>document.getElementById(id);
const users=()=>JSON.parse(localStorage.getItem('mb_users')||'{}');
const validEmail=e=>/^[A-Z0-9._%+-]+@gmail.com/i.test(String(e ?? '').trim());
function showAuth(which){['login','register','forgot'].forEach(x=>$(x+'Form').classList.toggle('hidden',x!==which));}
function login(){let e=$('loginEmail').value.trim().toLowerCase(),p=$('loginPass').value; if(!validEmail(e))return $('loginMsg').textContent='กรุณาใช้อีเมลที่ลงท้ายด้วย @gmail.com';let u=users()[e];if(!u||u.password!==p)return $('loginMsg').textContent='อีเมลหรือรหัสผ่านไม่ถูกต้อง';currentUser=e;enterStore();}
function register(){let n=$('regName').value.trim(),e=$('regEmail').value.trim().toLowerCase(),p=$('regPass').value,c=$('regConfirm').value;let m=$('regMsg');if(!n)return m.textContent='กรุณากรอกชื่อ';if(!validEmail(e))return m.textContent='อีเมลต้องลงท้ายด้วย @gmail.com เท่านั้น';if(p.length<8)return m.textContent='รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';if(p!==c)return m.textContent='ยืนยันรหัสผ่านไม่ตรงกัน';let all=users();if(all[e])return m.textContent='อีเมลนี้มีบัญชีแล้ว';all[e]={name:n,password:p};localStorage.setItem('mb_users',JSON.stringify(all));currentUser=e;enterStore();toast('สมัครสมาชิกสำเร็จ');}
function resetPassword(){let e=$('forgotEmail').value.trim().toLowerCase(),p=$('forgotPass').value,m=$('forgotMsg');if(!validEmail(e))return m.textContent='กรุณากรอกอีเมล Gmail ให้ถูกต้อง';if(p.length<8)return m.textContent='รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';let all=users();if(!all[e])return m.textContent='ไม่พบบัญชีนี้ในระบบตัวอย่าง';all[e].password=p;localStorage.setItem('mb_users',JSON.stringify(all));showAuth('login');toast('เปลี่ยนรหัสผ่านแล้ว');}
function enterStore(){ $('auth').classList.add('hidden');$('store').classList.remove('hidden');$('userLabel').textContent=users()[currentUser]?.name||'สมาชิก';navigate('home');}
function logout(){currentUser=null;$('store').classList.add('hidden');$('auth').classList.remove('hidden');showAuth('login');$('loginPass').value='';}
function navigate(page,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(page==='orders'){let orders=JSON.parse(localStorage.getItem('mb_orders')||'{}')[currentUser]||[];$('mainContent').innerHTML=`<div class="section-head"><h2>ประวัติการสั่งซื้อ</h2><span>ORDER HISTORY</span></div><div class="page-panel">${orders.length?orders.slice().reverse().map(o=>`<div class="order"><div><b>${o.name}</b><div class="status">${o.date}</div></div><strong class="price">฿${o.price.toLocaleString('th-TH')}</strong></div>`).join(''):'<div class="empty">ยังไม่มีประวัติการสั่งซื้อ<br>เลือกสินค้าที่ชอบแล้วเริ่มช้อปกันเลย</div>'}</div>`;return;}
renderHome();}
function renderHome(filter=''){let list=filter?products.filter(p=>p.cat===filter):products;$('mainContent').innerHTML=`
<section class="hero"><img src="logo-store.png" alt="MB Option Fashion"><div class="hero-copy"><h1>MB OPTION</h1><p>FASHION FOR YOU · ใส่ได้ทุกสไตล์ ในแบบที่เป็นคุณ</p></div></section>
<div class="section-head"><h2>เลือกช้อปตามหมวดหมู่</h2><span>SHOP BY CATEGORY</span></div>
<div class="categories">${categories.map(c=>`<button class="cat" onclick="showCategory('${c.name}')"><span class="emoji">${c.emoji}</span><b>${c.name}</b></button>`).join('')}</div>
<div class="section-head"><h2>${filter||'สินค้าแนะนำ'}</h2><span>${list.length} ITEMS</span></div>
<div class="products">${list.map((p,i)=>`<article class="product"><div class="product-art">${p.emoji}</div><div class="product-info"><small>${p.cat}</small><b>${p.name}</b><span class="price">฿${p.price.toLocaleString('th-TH')}</span><button onclick="buy(${products.indexOf(p)})">สั่งซื้อสินค้า</button></div></article>`).join('')}</div>`;}
function showCategory(cat){closeModal();navigate('home');renderHome(cat);}
function openCategory(){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2>เลือกหมวดหมู่สินค้า</h2><button class="close" onclick="closeModal()">✕</button></div><p class="sub">ค้นหาสไตล์ที่ใช่สำหรับคุณ</p><div class="modal-grid">${categories.map(c=>`<button onclick="showCategory('${c.name}')">${c.emoji} &nbsp; ${c.name}</button>`).join('')}</div></div></div>`;}
function closeModal(){$('modalRoot').innerHTML='';}
function buy(i){let p=products[i],all=JSON.parse(localStorage.getItem('mb_orders')||'{}');all[currentUser]=all[currentUser]||[];all[currentUser].push({name:p.name,price:p.price,date:new Date().toLocaleString('th-TH')});localStorage.setItem('mb_orders',JSON.stringify(all));toast('เพิ่มรายการสั่งซื้อในประวัติแล้ว');}
function toast(t){$('toastRoot').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('toastRoot').innerHTML='',2400);}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script>
</body></html>
